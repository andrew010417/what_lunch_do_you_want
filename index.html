<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BioNexus 점심 고르기</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <img class="logo" src="assets/logo.png" alt="BioNexus" />
    <div>
      <h1>오늘 점심 뭐 먹지?</h1>
      <p class="sub">출근한 사람을 체크하면 다같이 좋아하는 메뉴가 위로 올라옵니다</p>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main id="office-view">
    <section class="card">
      <div class="section-head">
        <h2>오늘 출근한 사람</h2>
        <div class="actions">
          <button class="ghost" id="select-all">전체 선택</button>
          <button class="ghost" id="clear-all">초기화</button>
        </div>
      </div>
      <div class="people" id="people"></div>
      <p class="hint" id="selection-summary"></p>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>점심 메뉴 순위</h2>
        <div class="actions">
          <button class="primary" id="pick">🎲 상위 메뉴 중 뽑기</button>
        </div>
      </div>
      <div class="pick-result" id="pick-result" hidden></div>
      <ol class="menus" id="menus"></ol>
    </section>
  </main>

  <main id="coming-soon" class="card coming-soon" hidden>
    <div class="big">🚧</div>
    <h2 id="coming-soon-title"></h2>
    <p>아직 준비 중이에요. 곧 오픈합니다!</p>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
